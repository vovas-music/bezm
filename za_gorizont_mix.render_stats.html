    x += ctx.measureText(data.series[i]).width+96;
  }

    tipy -= 24*data.series.length/2;
    for (let i=0; str[i]; ++i) {
      text(ctx, !i ? '#000000' : colors[i-1], 'center', 'middle', str[i], tipx, tipy);

    }
